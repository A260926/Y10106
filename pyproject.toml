[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lease-lab"
version = "0.1.0"
description = "租约语义演算器：显式 tick 驱动的租约/ fencing token 实验台"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["lease_lab*"]

[tool.setuptools.package-data]
lease_lab = ["static/*"]
